</head>
<body>

    <header>
        <h1>AniMangá Hub ⚡</h1>
        
        <div class="controls">
            <nav class="tabs-nav">
                <button class="tab-btn active" onclick="switchTab('all', this)">Início</button>
                <button class="tab-btn" onclick="switchTab('anime', this)">Animes</button>
                <button class="tab-btn" onclick="switchTab('manga', this)">Mangás</button>
                <button class="tab-btn" onclick="switchTab('fav', this)">⭐ Minha Lista</button>
            </nav>

            <div class="search-group">
                <select id="genreFilter" class="filter-select" onchange="executarPesquisa()">
                    <option value="">Todos os Gêneros</option>
                    <option value="1">Ação</option>
                    <option value="2">Aventura</option>
                    <option value="4">Comédia</option>
                    <option value="8">Drama</option>
                    <option value="10">Fantasia</option>
                    <option value="14">Horror</option>
                    <option value="22">Romance</option>
                    <option value="24">Ficção Científica</option>
                    <option value="36">Slice of Life</option>
                    <option value="30">Esportes</option>
                    <option value="37">Sobrenatural</option>
                </select>

                <div class="search-box">
                    <input type="text" id="searchBar" placeholder="Pesquisar..." oninput="debounceSearch()">
                </div>
            </div>
        </div>
    </header>

    <main id="mainContainer"></main>

    <!-- Modal com Player de Trailer e Episódios -->
    <div id="modalCapitulos" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="fecharModal()">&times;</span>
            <h2 id="modalTitulo" style="font-size: 18px; color: var(--amarelo-destaque);"></h2>
            
            <div id="trailerArea" class="trailer-container"></div>

            <div id="listaCapitulosArea">
                <p class="sub-text">Selecione uma opção para reproduzir ou ler:</p>
                <div id="capitulosGrid" class="capitulos-grid"></div>
            </div>

            <div id="viewerContainer" class="viewer-container">
                <button onclick="voltarParaLista()" class="btn-back">← Voltar aos capítulos</button>
                <h3 id="viewerTitle" style="font-size: 15px; color: var(--amarelo-destaque);"></h3>
                <div id="viewerContent" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px;"></div>
            </div>
        </div>
    </div>

    <!-- Sistema de Alertas (Toast) -->
    <div id="toast" class="toast"></div>

    <script>
        let currentTab = 'all';
        let searchTimeout = null;
        let scrollTimers = [];
        let favoritos = JSON.parse(localStorage.getItem('favoritosHub') || '[]');

        window.addEventListener('DOMContentLoaded', inicializarHome);

        function switchTab(type, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTab = type;
            
            document.getElementById('searchBar').value = '';
            document.getElementById('genreFilter').value = '';

            if (currentTab === 'all') {
                inicializarHome();
            } else if (currentTab === 'fav') {
                carregarFavoritos();
            } else {
                carregarPaginaEspecifica();
            }
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(executarPesquisa, 500);
        }

        function mostrarToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function toggleFavorito(itemData) {
            const item = typeof itemData === 'string' ? JSON.parse(decodeURIComponent(itemData)) : itemData;
            const index = favoritos.findIndex(f => f.mal_id === item.mal_id);

            if (index >= 0) {
                favoritos.splice(index, 1);
                mostrarToast(`"${item.title}" removido da sua lista.`);
            } else {
                favoritos.push(item);
                mostrarToast(`"${item.title}" adicionado à sua lista! ⭐`);
            }

            localStorage.setItem('favoritosHub', JSON.stringify(favoritos));

            if (currentTab === 'fav') {
                carregarFavoritos();
            } else {
                document.querySelectorAll(`[data-id="${item.mal_id}"]`).forEach(btn => {
                    const isFav = favoritos.some(f => f.mal_id === item.mal_id);
                    btn.textContent = isFav ? '★' : '☆';
                });
            }
        }

        function carregarFavoritos() {
            limparScrolls();
            const main = document.getElementById('mainContainer');
            main.innerHTML = `
                <div class="fileira-titulo">⭐ Minha Lista de Favoritos</div>
                <div class="grid-pesquisa" id="gridFavoritos"></div>
            `;

            const grid = document.getElementById('gridFavoritos');
            if (favoritos.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; color: var(--texto-cinza); text-align: center; padding: 20px;">Sua lista está vazia. Adicione itens clicando na estrela ⭐</p>`;
                return;
            }

            grid.innerHTML = favoritos.map(item => criarCardHTML(item)).join('');
        }

        function limparScrolls() {
            scrollTimers.forEach(timer => clearInterval(timer));
            scrollTimers = [];
        }

        function ativarAutoScroll(elementId) {
            const container = document.getElementById(elementId);
            if (!container) return;

            let interval = setInterval(() => {
                if (container.scrollLeft + container.clientWidth >= container.scrollWidth - 1) {
                    container.scrollLeft = 0;
                } else {
                    container.scrollLeft += 1;
                }
            }, 25);

            container.addEventListener('mouseenter', () => clearInterval(interval));
            container.addEventListener('mouseleave', () => {
                interval = setInterval(() => {
                    if (container.scrollLeft + container.clientWidth >= container.scrollWidth - 1) {
                        container.scrollLeft = 0;
                    } else {
                        container.scrollLeft += 1;
                    }
                }, 25);
            });

            scrollTimers.push(interval);
        }

        async function inicializarHome() {
            limparScrolls();
            const main = document.getElementById('mainContainer');

            main.innerHTML = `
                <div class="fileira-secao">
                    <div class="fileira-titulo">🔥 Fileira 1: Animes Populares</div>
                    <div class="carrossel-container" id="rowPopularAnimes"><p class="loading-text">Carregando animes...</p></div>
                </div>
                <div class="fileira-secao">
                    <div class="fileira-titulo">📖 Fileira 2: Mangás Populares</div>
                    <div class="carrossel-container" id="rowPopularMangas"><p class="loading-text">Carregando mangás...</p></div>
                </div>
            `;

            await carregarCarrossel('https://api.jikan.moe/v4/top/anime?limit=12', 'rowPopularAnimes', 'anime');
            await new Promise(r => setTimeout(r, 800));
            await carregarCarrossel('https://api.jikan.moe/v4/top/manga?limit=12', 'rowPopularMangas', 'manga');
        }

        async function carregarCarrossel(url, elementId, tipoPadrao) {
            const container = document.getElementById(elementId);
            try {
                const res = await fetch(url);
                const json = await res.json();
                if (json.data && json.data.length > 0) {
                    container.innerHTML = json.data.map(item => criarCardHTML(item, tipoPadrao)).join('');
                    ativarAutoScroll(elementId);
                } else {
                    container.innerHTML = `<p style="color:var(--texto-cinza); font-size:12px;">Nenhum item disponível.</p>`;
                }
            } catch (err) {
                container.innerHTML = `<p style="color:var(--texto-cinza); font-size:12px;">Erro ao carregar dados.</p>`;
            }
        }

        async function carregarPaginaEspecifica() {
            limparScrolls();
            const main = document.getElementById('mainContainer');
            const ehAnime = currentTab === 'anime';
            const tituloArea = ehAnime ? '📺 Catalogados para Assistir (Animes)' : '📖 Catalogados para Ler (Mangás)';
            
            main.innerHTML = `
                <div class="fileira-titulo">${tituloArea}</div>
                <div class="grid-pesquisa" id="gridEspecífica"><p class="loading-text">Carregando acervo...</p></div>
            `;

            const grid = document.getElementById('gridEspecífica');
            const endpoint = ehAnime 
                ? 'https://api.jikan.moe/v4/top/anime?limit=24' 
                : 'https://api.jikan.moe/v4/top/manga?limit=24';

            try {
                const res = await fetch(endpoint);
                const json = await res.json();
                grid.innerHTML = json.data.map(item => criarCardHTML(item, ehAnime ? 'anime' : 'manga')).join('');
            } catch (err) {
                grid.innerHTML = `<p style="grid-column: 1/-1; color: var(--texto-cinza); text-align: center;">Erro ao carregar lista.</p>`;
            }
        }

        async function executarPesquisa() {
            limparScrolls();
            const query = document.getElementById('searchBar').value.trim();
            const genre = document.getElementById('genreFilter').value;
            const main = document.getElementById('mainContainer');

            if (!query && !genre) {
                if (currentTab === 'all') inicializarHome();
                else if (currentTab === 'fav') carregarFavoritos();
                else carregarPaginaEspecifica();
                return;
            }

            if (currentTab === 'fav') {
                const filtrados = favoritos.filter(item => {
                    const matchQuery = !query || item.title.toLowerCase().includes(query.toLowerCase());
                    const matchGenre = !genre || (item.genres && item.genres.some(g => g.mal_id == genre));
                    return matchQuery && matchGenre;
                });

                main.innerHTML = `
                    <div class="fileira-titulo">🔍 Resultados em Favoritos</div>
                    <div class="grid-pesquisa" id="gridPesquisa"></div>
                `;
                const grid = document.getElementById('gridPesquisa');
                grid.innerHTML = filtrados.length > 0 
                    ? filtrados.map(item => criarCardHTML(item)).join('')
                    : `<p style="grid-column: 1/-1; color: var(--texto-cinza); text-align: center; padding: 20px;">Nenhum favorito encontrado.</p>`;
                return;
            }

            main.innerHTML = `
                <div class="fileira-titulo">🔍 Resultados Encontrados</div>
                <div class="grid-pesquisa" id="gridPesquisa"><p class="loading-text">Buscando no acervo...</p></div>
            `;

            const grid = document.getElementById('gridPesquisa');
            
            try {
                let resultados = [];

                const montarUrl = (tipo) => {
                    const params = new URLSearchParams();
                    if (query) params.append('q', query);
                    if (genre) params.append('genres', genre);
                    params.append('limit', '12');
                    params.append('sfw', 'true');
                    return `https://api.jikan.moe/v4/${tipo}?${params.toString()}`;
                };

                if (currentTab === 'all') {
                    const [resAnime, resManga] = await Promise.all([
                        fetch(montarUrl('anime')).then(r => r.json()),
                        fetch(montarUrl('manga')).then(r => r.json())
                    ]);

                    const animes = (resAnime.data || []).map(i => ({ ...i, media_type: 'anime' }));
                    const mangas = (resManga.data || []).map(i => ({ ...i, media_type: 'manga' }));

                    // Intercala os resultados de animes e mangás
                    const maxLen = Math.max(animes.length, mangas.length);
                    for (let i = 0; i < maxLen; i++) {
                        if (animes[i]) resultados.push({ item: animes[i], tipo: 'anime' });
                        if (mangas[i]) resultados.push({ item: mangas[i], tipo: 'manga' });
                    }
                } else {
                    const tipo = currentTab;
                    const res = await fetch(montarUrl(tipo));
                    const json = await res.json();
                    resultados = (json.data || []).map(i => ({ item: i, tipo: tipo }));
                }

                if (resultados.length === 0) {
                    grid.innerHTML = `<p style="grid-column: 1/-1; color: var(--texto-cinza); text-align: center; padding: 20px;">Nenhum item encontrado.</p>`;
                    return;
                }

                grid.innerHTML = resultados.map(r => criarCardHTML(r.item, r.tipo)).join('');
            } catch (err) {
                grid.innerHTML = `<p style="grid-column: 1/-1; color: var(--texto-cinza); text-align: center;">Erro de conexão com a API. Tente novamente em instantes.</p>`;
            }
        }

        function criarCardHTML(item, forcarTipo = null) {
            const autor = item.studios?.[0]?.name || item.authors?.[0]?.name || 'Autor / Estúdio';
            const imagem = item.images?.jpg?.large_image_url || item.images?.jpg?.image_url;
            
            let tipo = forcarTipo;
            if (!tipo) {
                tipo = (item.type && item.type.toLowerCase().includes('manga')) ? 'manga' : 'anime';
            }

            const textoBotao = tipo === 'anime' ? '📺 Assistir' : '📖 Ler';
            const descricao = item.synopsis || 'Sem sinopse disponível.';
            const isFav = favoritos.some(f => f.mal_id === item.mal_id);
            const itemDataEncoded = encodeURIComponent(JSON.stringify(item));

            return `
                <article>
                    <button class="btn-fav" data-id="${item.mal_id}" onclick="toggleFavorito('${itemDataEncoded}')" title="${isFav ? 'Remover dos Favoritos' : 'Favoritar'}">
                        ${isFav ? '★' : '☆'}
                    </button>
                    <img src="${imagem}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/220x240?text=Sem+Imagem'">
                    <div class="artigo-info">
                        <div>
                            <span class="artigo-autor">${autor}</span>
                            <h3 title="${item.title}">${item.title}</h3>
                            <p>${descricao}</p>
                        </div>
                        <button class="btn-read" onclick="abrirCapitulos('${itemDataEncoded}', '${tipo}')">
                            ${textoBotao}
                        </button>
                    </div>
                </article>
            `;
        }

        function abrirCapitulos(itemDataEncoded, tipo) {
            const item = JSON.parse(decodeURIComponent(itemDataEncoded));
            const modal = document.getElementById('modalCapitulos');
            
            document.getElementById('modalTitulo').textContent = item.title;
            const capitulosGrid = document.getElementById('capitulosGrid');
            const trailerArea = document.getElementById('trailerArea');

            capitulosGrid.innerHTML = '';
            trailerArea.innerHTML = '';
            voltarParaLista();

            if (item.trailer && item.trailer.embed_url) {
                trailerArea.innerHTML = `
                    <iframe src="${item.trailer.embed_url}" frameborder="0" allowfullscreen></iframe>
                `;
            }

            const total = tipo === 'anime' ? 12 : 20;
            const rotulo = tipo === 'anime' ? 'Episódio' : 'Capítulo';

            for (let i = 1; i <= total; i++) {
                const btn = document.createElement('button');
                btn.className = 'capitulo-btn';
                btn.textContent = `${rotulo} ${i}`;
                btn.onclick = () => carregarConteudo(item.title, tipo, i);
                capitulosGrid.appendChild(btn);
            }

            modal.style.display = 'flex';
        }

        function carregarConteudo(titulo, tipo, numero) {
            document.getElementById('listaCapitulosArea').style.display = 'none';
            document.getElementById('trailerArea').style.display = 'none';

            const viewer = document.getElementById('viewerContainer');
            const viewerTitle = document.getElementById('viewerTitle');
            const viewerContent = document.getElementById('viewerContent');

            viewer.style.display = 'flex';
            viewerTitle.textContent = `${titulo} - ${tipo === 'anime' ? 'Episódio' : 'Capítulo'} ${numero}`;

            if (tipo === 'manga') {
                viewerContent.innerHTML = `
                    <p style="font-size:11px; color:var(--texto-cinza);">Página 1 de 1</p>
                    <div style="background:#fff; color:#000; padding:40px; font-weight:bold; border-radius:6px; text-align:center; width: 100%;">
                        📖 Modo de Leitura - Capítulo ${numero}
                    </div>
                `;
            } else {
                viewerContent.innerHTML = `
                    <div class="video-player">
                        <div style="text-align:center;">
                            <p style="font-size:36px; margin-bottom:8px;">▶️</p>
                            <p style="font-size:13px; font-weight:bold; color:var(--amarelo-destaque);">Reproduzindo ${titulo} - Ep. ${numero}</p>
                        </div>
                    </div>
                `;
            }
        }

        function voltarParaLista() {
            document.getElementById('listaCapitulosArea').style.display = 'block';
            document.getElementById('trailerArea').style.display = 'block';
            document.getElementById('viewerContainer').style.display = 'none';
        }

        function fecharModal() {
            document.getElementById('modalCapitulos').style.display = 'none';
        }

        window.onclick = function(e) {
            if (e.target === document.getElementById('modalCapitulos')) fecharModal();
        }
    </script>
</body>
</html>
